<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — {{ 'SINANA' if sinana else 'WMS' }}</title>
<link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
<link rel="icon" href="{{ url_for('static', filename='brand/sinana-monogram.png') if sinana else url_for('static', filename='icons/icon-192.png') }}">
</head>
<body class="d-flex align-items-center" style="min-height:100vh;{% if sinana %}background:#f7f4ef;color:#17201e{% endif %}">
<div class="container" style="max-width:380px">
  <div class="text-center mb-4">
    {% if sinana %}
    <div class="d-flex align-items-center justify-content-center gap-3 mb-3">
      <img src="{{ url_for('static', filename='brand/sinana-monogram.png') }}" alt="" style="width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 5px 8px #0003)">
      <img src="{{ url_for('static', filename='brand/sinana-wordmark.png') }}" alt="SINANA" style="width:170px;height:auto">
    </div>
    <div class="text-muted">Система управления продажами</div>
    {% else %}<div style="font-size:2.5rem">📦</div><h3>WMS — вход</h3>{% endif %}
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'danger' else category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <div class="card p-4">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Логин</label>
        <input type="text" name="username" class="form-control form-control-lg" value="{{ username or '' }}" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Пароль</label>
        <input type="password" name="password" class="form-control form-control-lg" required>
      </div>
      <button type="submit" class="btn w-100 btn-lg {{ 'btn-dark' if sinana else 'btn-primary' }}">Войти</button>
    </form>
  </div>
</div>
</body>
</html>
