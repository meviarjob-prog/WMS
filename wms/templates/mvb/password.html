{% extends "mvb/base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<h3 class="mb-3">Смена пароля</h3>
<form method="post" class="card p-3" style="max-width:420px">
  <div class="mb-2"><label class="form-label">Текущий пароль</label><input type="password" name="current_password" class="form-control" required autocomplete="current-password"></div>
  <div class="mb-2"><label class="form-label">Новый пароль (от 6 символов)</label><input type="password" name="new_password" class="form-control" required minlength="6" autocomplete="new-password"></div>
  <div class="mb-3"><label class="form-label">Новый пароль еще раз</label><input type="password" name="new_password2" class="form-control" required minlength="6" autocomplete="new-password"></div>
  <button class="btn btn-success">Сохранить пароль</button>
  <div class="small text-muted mt-2">После смены пароля другие входы с этим логином (другие телефоны и компьютеры) завершатся.</div>
</form>
{% endblock %}
