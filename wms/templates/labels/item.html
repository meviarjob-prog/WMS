<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Этикетка {{ item.sku }}</title>
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body data-autoprint="{{ '1' if autoprint else '0' }}">
<div class="no-print p-2">
  <a href="{{ url_for('nomenclature.list_nomenclature') }}">&larr; Назад</a>
  <a class="btn btn-sm btn-primary" href="{{ url_for('labels.item_label_pdf', item_id=item.id) }}" target="_blank">Скачать PDF</a>
  <button class="btn btn-sm btn-outline-secondary" onclick="window.print()">Печать</button>
</div>

<div class="label-page">
  <img src="{{ barcode_img }}" alt="barcode">
  <div class="label-title">{{ item.name }}</div>
  <div class="label-subtitle">арт. {{ item.sku }}</div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
