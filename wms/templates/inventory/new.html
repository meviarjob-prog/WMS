{% extends "base.html" %}
{% block title %}Новая инвентаризация{% endblock %}
{% block content %}
<p><a href="{{ url_for('inventory.list_documents') }}">&larr; Инвентаризация</a></p>
<h3 class="mb-4">Новый лист инвентаризации</h3>

<div class="col-md-5">
  <div class="card p-3">
    <p class="text-muted small">Все короба, которые вы отсканируете в этом листе, должны быть на выбранном складе.</p>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Склад</label>
        <select name="warehouse_id" class="form-select" required>
          <option value="">Выберите склад...</option>
          {% for wh in warehouses %}
            <option value="{{ wh.id }}">{{ wh.code }} — {{ wh.name }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Создать лист и сканировать короба</button>
    </form>
  </div>
</div>
{% endblock %}
